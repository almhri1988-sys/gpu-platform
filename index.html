<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة تأجير GPU</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0b0b0b;
      color: #fff;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    section {
      background: #151515;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    h1, h2 { text-align: center; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
    }
    textarea { min-height: 70px; }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .station-card {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      margin-bottom: 10px;
    }
    .price {
      background: #22c55e;
      color: #000;
      padding: 3px 7px;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>منصة تأجير وحدات GPU</h1>

  <!-- تسجيل محطة -->
  <section>
    <h2>تسجيل محطة جديدة</h2>
    <form id="stationForm">

      <label>اسم صاحب المحطة</label>
      <input id="ownerName" required>

      <label>وسيلة التواصل</label>
      <input id="contactMethod" required placeholder="إيميل أو رقم أو تليجرام">

      <label>نوع الـ GPU</label>
      <select id="gpuType" required>
        <option value="RTX 4090">RTX 4090</option>
        <option value="RTX 4080">RTX 4080</option>
        <option value="RTX 3090">RTX 3090</option>
        <option value="A100">A100</option>
        <option value="Other">أخرى</option>
      </select>

      <label>السعر بالساعة ($)</label>
      <input id="pricePerHour" type="number" step="0.01" required>

      <label>الدولة</label>
      <input id="country" required>

      <label>المدينة</label>
      <input id="city" required>

      <label>ملاحظات (اختياري)</label>
      <textarea id="notes"></textarea>

      <button type="submit">حفظ المحطة</button>
    </form>
  </section>

  <!-- عرض المحطات -->
  <section>
    <h2>المحطات المتاحة</h2>
    <div id="stationsList"></div>
  </section>

  <!-- رسالة للإدارة -->
  <section>
    <h2>رسالة للإدارة</h2>
    <form id="adminForm">

      <label>اسمك</label>
      <input id="adminName" required>

      <label>وسيلة التواصل</label>
      <input id="adminContact" required>

      <label>نوع الرسالة</label>
      <select id="adminType">
        <option value="استفسار">استفسار</option>
        <option value="مشكلة">بلاغ عن مشكلة</option>
        <option value="اقتراح">اقتراح تطوير</option>
      </select>

      <label>النص</label>
      <textarea id="adminMessage" required></textarea>

      <button type="submit">إرسال</button>
    </form>
  </section>

</div>

<!-- Firebase -->
<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    serverTimestamp,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // *********************
  // 🔥 ضع بيانات Firebase هنا
  // *********************
  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECTID",
    storageBucket: "YOUR_BUCKET",
    messagingSenderId: "YOUR_SENDER",
    appId: "YOUR_APPID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // تسجيل محطة
  document.getElementById("stationForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      ownerName: ownerName.value,
      contactMethod: contactMethod.value,
      gpuType: gpuType.value,
      pricePerHour: parseFloat(pricePerHour.value),
      country: country.value,
      city: city.value,
      notes: notes.value,
      createdAt: serverTimestamp()
    };

    await addDoc(collection(db, "stations"), data);
    alert("تم تسجيل المحطة ✔");
    stationForm.reset();
    loadStations();
  });

  // تحميل المحطات
  async function loadStations() {
    const list = document.getElementById("stationsList");
    list.innerHTML = "جار التحميل...";

    const q = query(collection(db, "stations"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);

    list.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();

      const div = document.createElement("div");
      div.className = "station-card";

      div.innerHTML = `
        <b>${d.gpuType}</b>
        <div>${d.country} - ${d.city}</div>
        <div>صاحبها: ${d.ownerName}</div>
        <div>السعر: <span class="price">$${d.pricePerHour}/ساعة</span></div>
        <div>${d.notes || ""}</div>

        <label>عدد الساعات</label>
        <input type="number" min="1" value="1" id="h-${doc.id}">

        <button onclick="rent('${doc.id}', '${d.gpuType}', ${d.pricePerHour})">
          استئجار الآن
        </button>
      `;

      list.appendChild(div);
    });
  }

  window.rent = async function (id, gpu, price) {
    const hours = document.getElementById("h-" + id).value;
    const total = (hours * price).toFixed(2);

    if (!confirm(`استئجار ${gpu} لمدة ${hours} ساعة = $${total} ؟`)) return;

    await addDoc(collection(db, "rentalRequests"), {
      stationId: id,
      gpu,
      hours,
      total,
      createdAt: serverTimestamp(),
      status: "جديد"
    });

    alert("تم إرسال طلب الاستئجار ✔");
  };

  // رسالة للإدارة
  document.getElementById("adminForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    await addDoc(collection(db, "adminMessages"), {
      name: adminName.value,
      contact: adminContact.value,
      type: adminType.value,
      message: adminMessage.value,
      createdAt: serverTimestamp()
    });

    alert("تم إرسال الرسالة ✔");
    adminForm.reset();
  });

  loadStations();

</script>

</body>
</html>
