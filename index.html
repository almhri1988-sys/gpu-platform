<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GPU Rental Platform</title>
    <style>
        body { font-family: Arial; background:#111; color:white; text-align:center; }
        .card { background:#222; padding:20px; margin:20px; border-radius:10px; }
        button { padding:10px 20px; background:#00ff88; border:none; border-radius:5px; cursor:pointer; }
    </style>
</head>
<body>
    <h1>مرحباً بكم في منصة تأجير وحدات GPU</h1>
    <p>استأجر وحدات معالجة رسومية بأسعار تبدأ من 0.10$ بالساعة.</p>
    
    <div class="card">
        <h2>تسجيل محطة GPU</h2>
        <p>ارفع سيرفرك للمنصة واربح المال.</p>
        <button>تسجيل محطة</button>
    </div>
    
    <div class="card">
        <h2>استئجار GPU</h2>
        <p>تشغيل نماذج الذكاء الاصطناعي بسهولة.</p>
        <button>عرض الوحدات</button>
    </div>
</body>
</html>
